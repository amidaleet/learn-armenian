<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Слова</title>
    <link rel="stylesheet" href="../common.css" />
  </head>
  <body>
    <main class="wrap">
      <nav class="crumb"><a href="../">Игры</a></nav>
      <header>
        <h1>Слова</h1>
        <p class="lede">Бытовой набор. Слово по-армянски → русский смысл. Слушай слово, после ответа — фраза-пример.</p>
      </header>
      <section class="card">
        <div class="status">
          <span id="progress">Загрузка…</span>
          <span id="score"></span>
        </div>
        <div id="prompt" class="word" aria-live="polite"></div>
        <p id="hint" class="muted"></p>
        <div id="choices" class="choices"></div>
        <div id="feedback" class="feedback"></div>
        <div class="row">
          <button id="speak" class="btn" type="button" hidden>Слушать</button>
          <button id="next" class="btn btn-primary" type="button" disabled>Дальше</button>
          <button id="restart" class="btn" type="button">Заново</button>
        </div>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
